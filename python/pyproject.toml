[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-gear"
version = "0.1.3"
description = "Gear benchmark, refinement algorithms and optional training runtime"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9,<8"]

[project.optional-dependencies]
dev = ["ruff==0.17.0", "mypy==2.4.0"]
agents = ["openai-codex==0.159.3"]
gateway = ["aiohttp>=3.11,<4"]

[project.scripts]
gear-training = "gear.training.job:main"
gear-python = "gear.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gear*", "gear_training*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["gear/training", "gear_training", "gear/_protocol/generated.py"]

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
files = ["gear/algorithms", "gear/project.py"]
